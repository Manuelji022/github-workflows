            process.exit(1);
          }
          JS
          if ! command -v corepack >/dev/null; then
            echo "::error::pnpm requires a Node distribution with Corepack (Node 22 or 24)."
            exit 1
          fi
          corepack enable pnpm
          pnpm --version
      - name: Restore package-manager cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
      - name: Install locked dependencies
        shell: bash
        run: |
          if [ "$PACKAGE_MANAGER" = pnpm ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi
      - name: Run typecheck
        shell: bash
        run: |
          node <<'JS'
          const { scripts } = require('./package.json');
          if (typeof scripts?.typecheck !== 'string' || !scripts.typecheck.trim()) {
            console.error('::error::Enabled check requires a non-empty typecheck script in package.json.');
            process.exit(1);
          }
          JS
          "$PACKAGE_MANAGER" run typecheck

  test:
    name: test
    if: ${{ inputs.run-tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate package manager
        shell: bash
        run: |
          case "$PACKAGE_MANAGER" in
