name: Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use.
        type: string
        default: "22"
      package-manager:
        description: Package manager (npm or pnpm).
        type: string
        default: npm
      run-lint:
        description: Run the lint script.
        type: boolean
        default: true
      run-typecheck:
        description: Run the typecheck script.
        type: boolean
        default: true
      run-tests:
        description: Run the test script.
        type: boolean
        default: true
      run-build:
        description: Run the build script.
        type: boolean
        default: true

permissions:
  contents: read

env:
  CI: true
  PACKAGE_MANAGER: ${{ inputs.package-manager }}
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_DEFAULT_TO_LATEST: "0"

jobs:
  lint:
    name: lint
    if: ${{ inputs.run-lint }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate package manager
        shell: bash
        run: |
          case "$PACKAGE_MANAGER" in
            npm|pnpm) ;;
            *) echo "::error::package-manager must be npm or pnpm"; exit 1 ;;
          esac
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Enable project-pinned pnpm
        if: inputs.package-manager == 'pnpm'
        shell: bash
        run: |
          node <<'JS'
          const { packageManager } = require('./package.json');
          if (!/^pnpm@\d+\.\d+\.\d+(?:\+sha(?:224|256|384|512)\.[a-fA-F0-9]+)?$/.test(packageManager || '')) {
            console.error('::error::Declare an exact stable pnpm version in package.json packageManager (pnpm@X.Y.Z, optionally with an integrity hash).');
            process.exit(1);
          }
          JS
          if ! command -v corepack >/dev/null; then
            echo "::error::pnpm requires a Node distribution with Corepack (Node 22 or 24)."
            exit 1
          fi
          corepack enable pnpm
          pnpm --version
      - name: Restore package-manager cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
      - name: Install locked dependencies
        shell: bash
        run: |
          if [ "$PACKAGE_MANAGER" = pnpm ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi
      - name: Run lint
        shell: bash
        run: |
          node <<'JS'
          const { scripts } = require('./package.json');
          if (typeof scripts?.lint !== 'string' || !scripts.lint.trim()) {
            console.error('::error::Enabled check requires a non-empty lint script in package.json.');
            process.exit(1);
          }
          JS
          "$PACKAGE_MANAGER" run lint

  typecheck:
    name: typecheck
    if: ${{ inputs.run-typecheck }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
